<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Eats Map — FoodieLand Nashville 2026</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0b0c10">
  <link rel="stylesheet" href="index.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Outfit:wght@500;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
</head>
<body>
  <div class="app-container">
    
    <!-- TOP AREA: Weather, Venue, and Program (Sun Map 3-Button Grid) -->
    <header class="dashboard-top">
      <button class="top-btn" id="btn-weather" aria-label="Weather Forecast">
        <div class="btn-icon" id="weather-icon">🌤️</div>
        <div class="btn-label">
          <span class="btn-title">Weather</span>
          <span class="btn-subtitle" id="weather-status">84°F / Warm</span>
        </div>
      </button>

      <button class="top-btn" id="btn-venue" aria-label="Venue Guide">
        <div class="btn-icon">🏟️</div>
        <div class="btn-label">
          <span class="btn-title">Speedway</span>
          <span class="btn-subtitle" id="venue-status">Lebanon, TN</span>
        </div>
      </button>

      <button class="top-btn" id="btn-timeline" aria-label="Event Program">
        <div class="btn-icon">⏰</div>
        <div class="btn-label">
          <span class="btn-title">Program</span>
          <span class="btn-subtitle" id="timeline-status">Fri 8/28</span>
        </div>
      </button>
    </header>

    <!-- VENUE SUB-HEADER ACTIONS (Collapsible) -->
    <div class="sub-header-venue" id="sub-header-venue" style="display: none;">
      <button class="sub-venue-btn" id="btn-venue-car" aria-label="Mark or Find Car Spot / Get Directions">
        <span class="gps-dot-indicator" id="gps-dot-indicator" title="GPS Access Status"></span>
        <span id="btn-car-icon">🚗</span> <span id="btn-car-text">Mark my car</span>
      </button>
      <button class="sub-venue-btn" id="btn-venue-fac" aria-label="Show Grounds Map">🗺️ Grounds Map</button>
      <button class="sub-venue-btn" id="btn-venue-help" aria-label="Call Medical Help">🏥 First Aid</button>
    </div>

    <!-- LIVE STATUS / ALERT BANNER -->
    <div class="status-banner" id="alert-banner">
      <div class="banner-center-text">
        <span class="alert-pulse"></span>
        <span class="banner-text" id="alert-text">FoodieLand Nashville • 200+ Global Flavors & Night Market</span>
      </div>
    </div>

    <!-- ALLERGEN & INTOLERANCE FLAG TRAY (Collapsible Halfway Dropdown) -->
    <div class="allergen-pref-bar" id="allergen-pref-bar">
      <button class="allergen-toggle-header" id="allergen-toggle-btn" aria-label="Toggle Allergen Filter Tray">
        <div class="allergen-header-left">
          <span class="allergen-title-icon">⚠️</span>
          <span class="allergen-title-text">Flag Allergens / Aversions</span>
          <span class="allergen-badge" id="active-avoid-badge">0</span>
        </div>
        <div class="allergen-caret" id="allergen-caret">▼</div>
      </button>

      <div class="allergen-expand-panel" id="allergen-expand-panel">
        <div class="allergen-panel-instruction">Tap any to flag on menus (never hides food):</div>
        <div class="allergen-grid" id="allergen-chips-tray">
          <button class="chip-btn" data-allergen="Cilantro">🌿 Cilantro</button>
          <button class="chip-btn" data-allergen="Peanuts">🥜 Peanuts</button>
          <button class="chip-btn" data-allergen="Tree Nuts">🌰 Tree/Pine Nuts</button>
          <button class="chip-btn" data-allergen="Pork / Bacon">🥓 Pork / Bacon</button>
          <button class="chip-btn" data-allergen="Dairy">🧀 Dairy</button>
          <button class="chip-btn" data-allergen="Gluten/Wheat">🌾 Gluten</button>
          <button class="chip-btn" data-allergen="Shellfish">🦐 Shellfish</button>
          <button class="chip-btn" data-allergen="Fennel / Anise">🌱 Fennel/Anise</button>
          <button class="chip-btn" data-allergen="Mayo">🥚 Mayo</button>
          <button class="chip-btn" data-allergen="Sesame">✨ Sesame</button>
          <button class="chip-btn chip-btn-custom" id="btn-custom-allergen" data-allergen="custom">🔍 Custom...</button>
        </div>

        <!-- Custom Item Active Tag Display -->
        <div class="custom-active-tray" id="custom-active-tray" style="display: none;"></div>

        <!-- Safety / Knowledge Limit Disclaimer -->
        <div class="allergen-disclaimer">
          ⚠️ <em>Curated from public menu data and vendor listings, not an official medical authority. Please confirm critical allergies directly with booth staff.</em>
        </div>
      </div>
    </div>

    <!-- Backdrop overlay to dismiss allergen dropdown when tapping outside -->
    <div class="allergen-backdrop" id="allergen-backdrop"></div>

    <!-- CENTER AREA: Sun Map Square Viewport -->
    <main class="viewport-square" id="main-viewport">
      <!-- Floating Navigation History Back Button -->
      <button class="viewport-back-fab" id="viewport-back-fab" aria-label="Go Back" style="display: none;">
        ◀ Back
      </button>
      <div class="viewport-content" id="viewport-content">
        <!-- Injected via JavaScript -->
      </div>
    </main>

    <!-- BOTTOM AREA: Authentic Sun Map 3 Columns + 2 Dove-tailed Buttons -->
    <footer class="dashboard-bottom">
      <button class="bottom-btn" id="btn-booths" aria-label="Menu of Places">
        <div class="btn-icon">🥢</div>
        <div class="btn-label">
          <span class="btn-title">Menu</span>
          <span class="btn-subtitle" id="booth-sub-label">All Booths</span>
        </div>
      </button>

      <!-- Center Container: Fork Icon Home + Tucked Shoulder Buttons (Map & Help) -->
      <div class="home-btn-container">
        <button class="tiny-foot-btn" id="btn-foot-map" aria-label="Grounds Map">🗺️</button>
        <button class="bottom-btn" id="btn-home" aria-label="Home (Now Playing)">
          <div class="btn-icon" id="home-btn-icon">🍴</div>
          <div class="btn-label">
            <span class="btn-title">Eats</span>
            <span class="btn-subtitle">Now Playing</span>
          </div>
        </button>
        <button class="tiny-foot-btn" id="btn-foot-help" aria-label="Help & About">?</button>
      </div>

      <button class="bottom-btn" id="btn-passport" aria-label="Tasting Wishlist">
        <div class="btn-icon">⭐</div>
        <div class="btn-label">
          <span class="btn-title">Wishlist</span>
          <span class="btn-subtitle" id="wishlist-sub-label">0 Queued</span>
        </div>
      </button>
    </footer>

  </div>

  <!-- DETAIL MODAL SHEET -->
  <div class="modal-backdrop" id="detail-modal">
    <div class="modal-sheet" id="modal-content"></div>
  </div>

  <!-- SCRIPTS -->
  <script src="data_bundle.js"></script>
  <script src="map_logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
