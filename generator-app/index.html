<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sun Map - Intake Generator</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #121212; color: #fff; max-width: 800px; margin: 0 auto; padding: 20px; }
        h1 { color: #ff9f0a; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .panel { background: #1c1c1e; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        label { display: block; margin-top: 10px; color: #aaa; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
        input[type="text"], input[type="date"] { width: 100%; padding: 10px; margin-top: 5px; background: #2c2c2e; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; }
        button { background: #ff9f0a; color: #000; border: none; padding: 10px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        button:hover { background: #ffb340; }
        button:disabled { background: #555; color: #888; cursor: not-allowed; }
        
        #log-container { background: #000; color: #0f0; font-family: "Courier New", Courier, monospace; padding: 15px; height: 300px; overflow-y: auto; border-radius: 4px; border: 1px solid #333; font-size: 0.9rem; }
        .log-entry { margin: 2px 0; }
        
        .steering-controls { display: none; margin-top: 15px; padding-top: 15px; border-top: 1px dashed #444; }
        #hint-input { width: calc(100% - 120px); display: inline-block; }
        #btn-hint { width: 100px; display: inline-block; background: #34c759; }
    </style>
</head>
<body>

    <h1>Sun Map Intake Generator</h1>
    
    <div class="panel" id="intake-form">
        <h3>Seed Data</h3>
        <label>Headliner Band</label>
        <input type="text" id="input-band" placeholder="e.g. Young the Giant" value="Young the Giant">
        
        <label>Venue / Location</label>
        <input type="text" id="input-venue" placeholder="e.g. Ascend Amphitheater, Nashville, TN" value="Ascend Amphitheater, Nashville, TN">
        
        <label>Date</label>
        <input type="date" id="input-date" value="2026-06-27">
        
        <button id="btn-generate">Start Generation Pipeline</button>
    </div>

    <div class="panel" id="monitor-panel">
        <h3>Pipeline Monitor</h3>
        <div id="log-container"></div>
        
        <div class="steering-controls" id="steering-controls">
            <h4 style="color:#ff9f0a; margin-top:0;">Agent Paused for Review</h4>
            <button id="btn-approve" style="background: #0a84ff; color: #fff;">Approve & Continue Pass</button>
            <div style="margin-top: 15px;">
                <input type="text" id="hint-input" placeholder="Inject custom hint or correction...">
                <button id="btn-hint">Inject Hint</button>
            </div>
        </div>
    </div>

    <script>
        let pollingInterval = null;
        let lastLogCount = 0;

        document.getElementById('btn-generate').addEventListener('click', async () => {
            const btn = document.getElementById('btn-generate');
            btn.disabled = true;
            btn.textContent = "Pipeline Running...";
            
            const seed = {
                band: document.getElementById('input-band').value,
                venue: document.getElementById('input-venue').value,
                date: document.getElementById('input-date').value
            };
            
            await fetch('/api/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(seed)
            });
            
            document.getElementById('log-container').innerHTML = '';
            lastLogCount = 0;
            
            if (pollingInterval) clearInterval(pollingInterval);
            pollingInterval = setInterval(pollStatus, 1000);
        });
        
        document.getElementById('btn-approve').addEventListener('click', async () => {
            await fetch('/api/approve', { method: 'POST' });
            document.getElementById('steering-controls').style.display = 'none';
        });
        
        document.getElementById('btn-hint').addEventListener('click', async () => {
            const hint = document.getElementById('hint-input').value;
            if (!hint) return;
            await fetch('/api/hint', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ hint })
            });
            document.getElementById('hint-input').value = '';
            document.getElementById('steering-controls').style.display = 'none';
        });

        async function pollStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                
                // Update logs
                const logContainer = document.getElementById('log-container');
                if (data.logs.length > lastLogCount) {
                    for (let i = lastLogCount; i < data.logs.length; i++) {
                        const div = document.createElement('div');
                        div.className = 'log-entry';
                        div.textContent = data.logs[i];
                        logContainer.appendChild(div);
                    }
                    lastLogCount = data.logs.length;
                    logContainer.scrollTop = logContainer.scrollHeight;
                }
                
                // Handle steering controls
                const steering = document.getElementById('steering-controls');
                if (data.paused) {
                    steering.style.display = 'block';
                } else {
                    steering.style.display = 'none';
                }
                
                // Handle completion
                if (data.status === 'complete') {
                    clearInterval(pollingInterval);
                    const btn = document.getElementById('btn-generate');
                    btn.disabled = false;
                    btn.textContent = "Start Generation Pipeline";
                }
                
            } catch(e) {
                console.error("Polling error", e);
            }
        }
    </script>
</body>
</html>
