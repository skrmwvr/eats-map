<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- Primary Document Identity -->
  <title>☀️ Eats Map • FoodieLand Nashville 2026</title>
  <meta name="description" content="Offline companion guide for FoodieLand Nashville 2026. 200+ vendor menus, interactive grounds GPS map, dietary filters, and tasting wishlist.">
  <meta name="keywords" content="FoodieLand, Nashville, Eats Map, Night Market, Food Festival, Food Guide, Sun Map">
  <meta name="author" content="Sun Map">
  
  <!-- W3C Web App Manifest & OS Theming -->
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#0b0c10">
  <meta name="color-scheme" content="dark">
  <meta name="application-name" content="Eats Map">
  
  <!-- iOS / Apple WebKit Capabilities -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Eats Map">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <meta name="format-detection" content="telephone=no">

  <!-- OpenGraph / Social Sharing (iMessage, WhatsApp, Twitter) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Sun Map">
  <meta property="og:title" content="Eats Map • FoodieLand Nashville 2026">
  <meta property="og:description" content="Explore 200+ food booths, find stages, mark your car, and curate your tasting crawl offline.">
  <meta property="og:image" content="./icon-512.png">
  
  <!-- Leaflet CSS for Vector Map Display -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  
  <!-- Google Fonts: Preload & Display Optional to eliminate FOUT (Flash of Unstyled/Resizing Text) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=optional" rel="stylesheet">
  
  <link rel="stylesheet" href="./index.css">
  
  <!-- Offline QR Code Generator Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
  <div id="app-container">
    
    <!-- TOP APP BAR (Snapped to top of viewport like bottom toolbar) -->
    <header id="top-bar">
      <!-- Quick Action / View Filter Pills (Clean 3-Button Stacked Architecture) -->
      <nav id="top-nav-pills">
        <button class="top-btn" id="btn-weather" onclick="window.app.switchViewport('weather')">
          <span class="btn-top-icon">☀️</span>
          <span class="btn-top-title">Weather</span>
          <span id="weather-temp-pill" class="btn-top-subtitle">78°F Clear</span>
        </button>
        <button class="top-btn" id="btn-venue" onclick="window.app.switchViewport('venue')">
          <span class="btn-top-icon">🏟️</span>
          <span class="btn-top-title">Venue</span>
          <span id="venue-info-pill" class="btn-top-subtitle">Superspeedway</span>
        </button>
        <button class="top-btn" id="btn-timeline" onclick="window.app.openTodaysProgram()">
          <span class="btn-top-icon">📅</span>
          <span class="btn-top-title">Program</span>
          <span id="program-day-pill" class="btn-top-subtitle">Today</span>
        </button>
      </nav>
    </header>

    <!-- BRAND & FESTIVAL STATUS BAND (Positioned below top toolbar, above dietary bar) -->
    <div id="brand-status-band" class="brand-status-band">
      <div id="brand-logo-wrap">
        <span class="sun-icon">☀️</span>
        <span class="brand-name">Eats Map</span>
      </div>
      <div id="festival-indicator">
        <span id="top-bar-event-name">FoodieLand Nashville 2026</span>
        <span id="top-bar-status" class="status-badge live">LIVE</span>
      </div>
    </div>

    <!-- INTOLERANCE & ALLERGEN PREFERENCE DRAWER (ACCORDION) -->
    <section id="allergen-pref-bar" class="allergen-bar">
      <div class="allergen-header" onclick="window.app.toggleAllergenPanel()">
        <div class="allergen-title">
          <span class="alert-icon">⚠️</span>
          <span>Dietary & Allergen Highlighting</span>
        </div>
        <div class="allergen-status-indicator">
          <span id="active-allergen-count-badge" class="count-pill">0 flagged</span>
          <span class="chevron-toggle">▼</span>
        </div>
      </div>
      <div id="allergen-chips-tray" class="chips-tray">
        <button class="chip-btn" data-allergen="Cilantro">🌿 Cilantro</button>
        <button class="chip-btn" data-allergen="Peanuts">🥜 Peanuts</button>
        <button class="chip-btn" data-allergen="Tree Nuts">🌰 Tree/Pine Nuts</button>
        <button class="chip-btn" data-allergen="Pork / Bacon">🥓 Pork / Bacon</button>
        <button class="chip-btn" data-allergen="Dairy">🧀 Dairy</button>
        <button class="chip-btn" data-allergen="Gluten/Wheat">🌾 Gluten</button>
        <button class="chip-btn" data-allergen="Shellfish">🦐 Shellfish</button>
        <button class="chip-btn" data-allergen="Fennel / Anise">🌱 Fennel/Anise</button>
        <button class="chip-btn" data-allergen="Mayo">🥚 Mayo</button>
        <button class="chip-btn" data-allergen="Sesame">✨ Sesame</button>
        <button class="chip-btn chip-btn-custom" id="btn-custom-allergen" data-allergen="custom">🔍 Custom...</button>
      </div>
    </section>
    <div id="allergen-backdrop" class="allergen-panel-backdrop" onclick="window.app.closeAllergenPanel()"></div>

    <!-- MAIN VIEWPORT CONTAINER -->
    <main id="main-viewport">
      <!-- Active view dynamically injected here -->
      <div id="loading-spinner" style="text-align: center; padding: 40px; color: var(--text-secondary);">
        <p>Loading FoodieLand Guide...</p>
      </div>
    </main>

    <!-- DETAIL / PROGRAM / PASSPORT MODAL (SHARED OVERLAY) -->
    <div id="detail-modal" class="modal-backdrop modal-overlay">
      <div id="modal-content" class="modal-sheet modal-card">
        <!-- Modal content injected dynamically -->
      </div>
    </div>

    <!-- BOTTOM APP NAVIGATION (Cockpit Toolbar: Menu | Left Wing [🗺️] | Center Sun [☀️] | Right Wing [❓] | Wishlist) -->
    <footer id="bottom-bar" class="dashboard-bottom">
      <!-- Left Action Bay: Menu + Booth Count -->
      <button class="bottom-btn" id="btn-booths" onclick="window.app.switchViewport('booths')">
        <span class="nav-icon">📖</span>
        <span class="nav-label">Menu</span>
        <span id="booth-count-subtext" class="nav-subtext">8 Booths</span>
      </button>

      <!-- Center Anchor Container with Left Wing (Map) and Right Wing (Help) -->
      <div class="home-btn-container">
        <!-- Left Wing: Event Overview Map with nearest Water & Restrooms -->
        <button class="tiny-foot-btn" id="btn-foot-map" onclick="window.app.openEventOverviewMap()" title="Grounds Overview Map (Water & Restrooms)" aria-label="Grounds Map">
          🗺️
        </button>

        <!-- Center Raised Sun Button: Eats Map Home -->
        <button class="bottom-btn active center-brand-btn" id="btn-home" onclick="window.app.switchViewport('home')" aria-label="Eats Map Home">
          <span class="nav-icon">☀️</span>
          <span class="nav-label one-line">Eats Map</span>
        </button>

        <!-- Right Wing: Instant Help, Safety, & Short About -->
        <button class="tiny-foot-btn" id="btn-foot-help" onclick="window.app.openContextHelpModal()" title="Help, Safety & Info" aria-label="Help">
          ❓
        </button>
      </div>

      <!-- Right Action Bay: Wishlist + Live Saved Count -->
      <button class="bottom-btn" id="btn-passport" onclick="window.app.switchViewport('passport')">
        <span class="nav-icon">⭐</span>
        <span class="nav-label">Wishlist</span>
        <span id="wishlist-count-subtext" class="nav-subtext">0 Saved</span>
      </button>
    </footer>

  </div>

  <!-- Leaflet Vector Engine -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  
  <!-- App Scripts & Embedded Data Bundles -->
  <script src="./data_bundle.js"></script>
  <script src="./map_logic.js"></script>
  <script src="./app.js"></script>
</body>
</html>
